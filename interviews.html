<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting — The Mobility Project</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="/interviews" />
    <script>
      (function () {
        var base = location.pathname.replace(/[^/]*$/, "");
        location.replace(base + "interviews");
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./interviews">/interviews</a>…</p>
  </body>
</html>
